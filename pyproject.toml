[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [".git", "test-results", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B009", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
